<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Illustration of a cattleya, the corsage orchid">
  <defs>
    <radialGradient id="ca-petal" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fdf3f8"/>
      <stop offset="100%" stop-color="#e9b6d1"/>
    </radialGradient>
    <radialGradient id="ca-lip" cx="50%" cy="18%" r="82%">
      <stop offset="0%" stop-color="#f4d98f"/>
      <stop offset="38%" stop-color="#d4699a"/>
      <stop offset="100%" stop-color="#7e2f56"/>
    </radialGradient>
  </defs>

  <!-- narrow sepals -->
  <ellipse cx="120" cy="44"  rx="14" ry="40" fill="url(#ca-petal)" stroke="#dda2c2" stroke-width="1.1"/>
  <ellipse cx="46"  cy="150" rx="13" ry="44" fill="url(#ca-petal)" stroke="#dda2c2" stroke-width="1.1" transform="rotate(38 46 150)"/>
  <ellipse cx="194" cy="150" rx="13" ry="44" fill="url(#ca-petal)" stroke="#dda2c2" stroke-width="1.1" transform="rotate(-38 194 150)"/>

  <!-- broad ruffled petals -->
  <path d="M112 96 C 88 76 56 68 30 80 C 12 88 12 108 28 118 C 50 132 88 130 112 116 Z"
        fill="url(#ca-petal)" stroke="#dda2c2" stroke-width="1.2"/>
  <path d="M128 96 C 152 76 184 68 210 80 C 228 88 228 108 212 118 C 190 132 152 130 128 116 Z"
        fill="url(#ca-petal)" stroke="#dda2c2" stroke-width="1.2"/>
  <g stroke="#dda2c2" stroke-width=".9" fill="none" opacity=".8">
    <path d="M108 104 C 84 96 56 92 30 96"/>
    <path d="M132 104 C 156 96 184 92 210 96"/>
  </g>

  <!-- the frilled trumpet lip -->
  <path d="M120 100 C 150 100 168 124 166 154 C 164 178 152 194 138 200
           C 132 190 126 196 120 202 C 114 196 108 190 102 200
           C 88 194 76 178 74 154 C 72 124 90 100 120 100 Z"
        fill="url(#ca-lip)" stroke="#6f2a4b" stroke-width="1.3"/>
  <path d="M96 118 C 106 110 134 110 144 118 C 134 128 106 128 96 118 Z" fill="#f6e3ad" opacity=".8"/>
  <g stroke="#5f2340" stroke-width="1.1" fill="none" opacity=".45">
    <path d="M120 128 L 120 194"/>
    <path d="M104 132 C 100 156 102 178 108 194"/>
    <path d="M136 132 C 140 156 138 178 132 194"/>
  </g>

  <!-- column tucked in the throat -->
  <path d="M120 96 C 128 96 132 104 130 112 C 126 118 114 118 110 112 C 108 104 112 96 120 96 Z" fill="#f4ecd2"/>
</svg>
