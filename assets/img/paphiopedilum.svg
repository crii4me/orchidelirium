<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Illustration of a slipper orchid flower">
  <defs>
    <linearGradient id="pa-dorsal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf2"/>
      <stop offset="70%" stop-color="#eef1e6"/>
      <stop offset="100%" stop-color="#cdd8bd"/>
    </linearGradient>
    <linearGradient id="pa-pouch" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#e5a6c1"/>
      <stop offset="100%" stop-color="#8f4062"/>
    </linearGradient>
  </defs>

  <!-- stem -->
  <path d="M120 196 C 120 214 116 226 108 238" fill="none" stroke="#5c6b46" stroke-width="5" stroke-linecap="round"/>

  <!-- dorsal sepal, the tall striped hood -->
  <path d="M120 12 C 156 34 168 74 158 104 C 140 96 100 96 82 104 C 72 74 84 34 120 12 Z"
        fill="url(#pa-dorsal)" stroke="#97a97c" stroke-width="1.4"/>
  <g stroke="#5c6b46" stroke-width="2.2" fill="none" opacity=".65" stroke-linecap="round">
    <path d="M120 20 L 120 100"/>
    <path d="M104 26 C 100 52 100 78 102 100"/>
    <path d="M136 26 C 140 52 140 78 138 100"/>
    <path d="M90 44 C 86 64 86 84 88 102"/>
    <path d="M150 44 C 154 64 154 84 152 102"/>
  </g>

  <!-- lateral petals, drooping and spotted -->
  <path d="M104 110 C 70 112 34 126 12 150 C 36 162 76 152 106 132 Z" fill="#dcc9a8" stroke="#b89f76" stroke-width="1.2"/>
  <path d="M136 110 C 170 112 206 126 228 150 C 204 162 164 152 134 132 Z" fill="#dcc9a8" stroke="#b89f76" stroke-width="1.2"/>
  <g fill="#8f4062" opacity=".7">
    <circle cx="82" cy="136" r="3.4"/><circle cx="60" cy="140" r="2.8"/>
    <circle cx="40" cy="146" r="2.4"/><circle cx="70" cy="128" r="2.4"/>
    <circle cx="158" cy="136" r="3.4"/><circle cx="180" cy="140" r="2.8"/>
    <circle cx="200" cy="146" r="2.4"/><circle cx="170" cy="128" r="2.4"/>
  </g>

  <!-- the slipper pouch -->
  <path d="M120 116 C 148 116 164 140 162 164 C 160 188 142 200 120 200 C 98 200 80 188 78 164 C 76 140 92 116 120 116 Z"
        fill="url(#pa-pouch)" stroke="#6f3450" stroke-width="1.4"/>
  <path d="M100 126 C 108 122 132 122 140 126 C 132 138 108 138 100 126 Z" fill="#fdfaf2" opacity=".55"/>
  <ellipse cx="120" cy="130" rx="20" ry="9" fill="#5b2740" opacity=".55"/>

  <!-- staminode -->
  <path d="M120 108 C 128 108 132 114 130 120 C 126 124 114 124 110 120 C 108 114 112 108 120 108 Z" fill="#f0e6c8" stroke="#c9b98d" stroke-width="1"/>
</svg>
